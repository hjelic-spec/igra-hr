<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dnevna piramida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Noćna piramida: duboko modro nebo, blokovi od svijetlog kamena koji se pri usponu pune zlatom.
   Jedan svjesno taman izgled (igra), zato nema svijetle teme; sve boje su ipak tokeni. */
:root {
  color-scheme: dark;
  --sky: #10142b;        /* pozadina */
  --sky-2: #1a2045;      /* plohe */
  --sky-3: #262e5e;      /* rubovi, neaktivno */
  --stone: #e8dcc2;      /* kamen: tekst i neodigrani blokovi */
  --stone-dim: #9e9a8f;  /* prigušeni tekst */
  --gold: #f4b740;       /* uspjeh, vrh, naglasak */
  --gold-deep: #c98a12;
  --ember: #ff6b4a;      /* greška, ulog */
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font: 16px/1.5 var(--font-body); color: var(--stone);
  background: radial-gradient(120% 70% at 50% 0%, #222a5c 0%, var(--sky) 60%) fixed, var(--sky);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 10px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* zaglavlje */
.top { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.brand { font: 800 17px/1 var(--font-display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; margin-right: auto; background: none; border: 0; padding: 4px 0; }
.brand svg { width: 22px; height: 22px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--sky-3); background: var(--sky-2); border-radius: 999px; padding: 6px 11px; font-size: 14px; font-weight: 600; }
.chip.flame { color: var(--gold); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--sky-3); background: var(--sky-2); display: grid; place-items: center; font-size: 16px; }
.icon-btn[aria-pressed="true"] { border-color: var(--gold); }

/* piramida */
.pyr { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 18px 0 14px; }
.pyr .row { display: flex; gap: 6px; }
.blk { position: relative; width: min(58px, 16vw); height: 36px; border-radius: 7px; display: grid; place-items: center;
  font: 700 13px/1 var(--font-display); color: color-mix(in srgb, var(--stone) 70%, var(--sky));
  background: color-mix(in srgb, var(--stone) 10%, var(--sky)); border: 1px solid color-mix(in srgb, var(--stone) 18%, var(--sky));
  transition: background .35s, color .35s, transform .35s; }
.blk.done { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: #3a2604; border-color: transparent; box-shadow: 0 0 18px -4px var(--gold); }
.blk.miss { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ember) 30%, var(--sky)) 0 6px, color-mix(in srgb, var(--ember) 14%, var(--sky)) 6px 12px); color: var(--ember); border-color: var(--ember); }
.blk.now { border: 2px solid var(--stone); color: var(--stone); animation: pulse 1.6s ease-in-out infinite; }
.blk.pop { animation: pop .5s ease-out; }
.blk .tag { position: absolute; top: -8px; right: -6px; font: 800 10px/1 var(--font-display); padding: 3px 5px; border-radius: 6px; background: var(--ember); color: #fff; }
.pyr .row:first-child .blk { width: min(70px, 19vw); height: 40px; }
.pyr.compact { gap: 4px; margin: 12px 0 6px; }
.pyr.compact .blk, .pyr.compact .row:first-child .blk { height: 24px; font-size: 11px; }
.pyr.compact .row { gap: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--stone) 18%, transparent); } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* rezultat u igri */
.hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hud div { min-width: 0; background: var(--sky-2); border: 1px solid var(--sky-3); border-radius: 12px; padding: 8px 10px; }
.hud small { display: block; font-size: 12px; color: var(--stone-dim); }
.hud b { font: 700 19px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.hud .lives b { color: var(--ember); letter-spacing: 2px; }
.hud .dbl b { color: var(--ember); }

.panel { margin-top: 14px; background: var(--sky-2); border: 1px solid var(--sky-3); border-radius: var(--r); padding: 18px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--stone-dim); font-weight: 700; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 7vw, 36px); line-height: 1.1; font-weight: 800; }
h2 { font-size: 20px; line-height: 1.25; font-weight: 700; }
.q { font: 600 20px/1.35 var(--font-body); margin: 6px 0 16px; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--sky-3); background: var(--sky); font-weight: 600; transition: border-color .2s, background .2s, transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--stone-dim); }
.opt:active:not(:disabled) { transform: scale(.98); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 700 12px/1 var(--font-display); background: var(--sky-3); color: var(--stone); }
.opt.right { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 18%, var(--sky)); }
.opt.right .k { background: var(--gold); color: #3a2604; }
.opt.wrong { border-color: var(--ember); background: color-mix(in srgb, var(--ember) 16%, var(--sky)); }
.opt.wrong .k { background: var(--ember); color: #fff; }
.opt:disabled { cursor: default; }
.timer { height: 6px; border-radius: 3px; background: var(--sky-3); overflow: hidden; margin: 10px 0 2px; }
.timer i { display: block; height: 100%; background: var(--stone); transition: width 1s linear, background .3s; }
.timer.low i { background: var(--ember); }
.meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--stone-dim); font-variant-numeric: tabular-nums; }
.fb { min-height: 28px; margin-top: 12px; font: 700 16px/1.4 var(--font-display); }
.fb.ok { color: var(--gold); } .fb.bad { color: var(--ember); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 700; font-size: 16px;
  background: var(--gold); color: #2a1b02; box-shadow: 0 6px 20px -8px var(--gold); transition: transform .1s; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--stone); border: 1px solid var(--sky-3); box-shadow: none; }
.btn.wide { width: 100%; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.row-btns .btn { flex: 1 1 160px; }

/* Dupli ili ništa */
.double { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--sky-3); background: transparent; }
.double .sw { flex: none; width: 46px; height: 26px; border-radius: 13px; background: var(--sky-3); position: relative; transition: background .2s; }
.double .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--stone); transition: transform .2s; }
.double[aria-pressed="true"] { border-style: solid; border-color: var(--ember); background: color-mix(in srgb, var(--ember) 10%, transparent); }
.double[aria-pressed="true"] .sw { background: var(--ember); }
.double[aria-pressed="true"] .sw::after { transform: translateX(20px); }
.double:disabled { opacity: .45; cursor: not-allowed; }
.double strong { display: block; font-family: var(--font-display); font-size: 14px; }
.double span.small { font-size: 13px; color: var(--stone-dim); }
.pips { margin-left: auto; display: flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--ember); }
.pips i.used { background: var(--sky-3); }


/* kraj */
.score-big { font: 800 clamp(48px, 16vw, 72px)/1 var(--font-display); color: var(--gold); font-variant-numeric: tabular-nums; margin: 8px 0 2px; }
.share { margin-top: 14px; background: var(--sky); border: 1px solid var(--sky-3); border-radius: 12px; padding: 12px 14px; white-space: pre; font-size: 18px; line-height: 1.35; overflow-x: auto; }
.count { font: 700 22px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.small { font-size: 13px; color: var(--stone-dim); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--stone-dim); }

/* ljestvica i profil */
.tabs { display: flex; gap: 6px; margin: 4px 0 12px; }
.tabs button { flex: 1; padding: 9px 6px; border-radius: 10px; border: 1px solid var(--sky-3); background: transparent; font-weight: 600; font-size: 14px; }
.tabs button.on { background: var(--stone); color: var(--sky); border-color: var(--stone); }
.list { display: grid; gap: 6px; }
.li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--sky); border: 1px solid var(--sky-3); }
.li .pos { font: 800 15px/1 var(--font-display); color: var(--stone-dim); text-align: center; }
.li:nth-child(1) .pos { color: var(--gold); }
.li .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; background: none; border: 0; text-align: left; padding: 0; }
.li .pts { font: 700 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.li .sub { display: block; font: 500 12px/1.3 var(--font-body); color: var(--stone-dim); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.stats div { background: var(--sky); border: 1px solid var(--sky-3); border-radius: 12px; padding: 10px 12px; }
.stats small { display: block; color: var(--stone-dim); font-size: 12px; }
.stats b { font: 700 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }

/* prijava */
label { display: block; font-size: 14px; font-weight: 600; margin-top: 12px; }
input { width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--sky-3); background: var(--sky); color: var(--stone); font: inherit; }
.err { color: var(--ember); min-height: 22px; font-size: 14px; margin-top: 8px; }
.linkish { background: none; border: 0; color: var(--gold); font-weight: 700; padding: 8px 0; }
.rules { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 15px; }
.rules li span:first-child { font-size: 18px; line-height: 1.3; text-align: center; }

.float { position: fixed; left: 50%; top: 38%; transform: translate(-50%, 0); font: 800 34px/1 var(--font-display); color: var(--gold); pointer-events: none; animation: floatUp 1s ease-out forwards; text-shadow: 0 4px 20px rgba(0,0,0,.5); z-index: 5; }
.float.bad { color: var(--ember); }
@keyframes floatUp { from { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -60px) scale(1.1); } }
.fade-in { animation: fadeIn .3s ease-out; }
@keyframes fadeIn { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" aria-label="Dnevna piramida, na igru">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 23 21H1Z" fill="var(--gold)"/><path d="M12 2 17.5 11.5h-11Z" fill="#fff3d6"/></svg>
      Piramida
    </button>
    <span id="streak"></span>
    <button class="icon-btn" id="sound" aria-label="Zvuk i vibracija" aria-pressed="true" title="Zvuk i vibracija">🔊</button>
    <nav id="nav" style="display:flex;gap:8px"></nav>
  </header>
  <main id="app"></main>
</div>
<script src="game.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const R = Game.RULES;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---- API (u probnoj verziji ova se funkcija zamjenjuje lokalnim motorom) ----
async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Greška'), { status: r.status });
  return d;
}
// ---- kraj API ----

let me = null, today = null, streak = 0, view = 'play', timerId = null, countId = null, wantDouble = false;

// ---------- zvuk i vibracija ----------
let soundOn = store.get('piramida-zvuk') !== '0', actx = null;
function tone(freq, dur, type = 'sine', at = 0, vol = .12) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
function buzz(p) { if (soundOn && navigator.vibrate) try { navigator.vibrate(p); } catch {} }
const sfx = {
  right() { tone(660, .12, 'triangle'); tone(990, .2, 'triangle', .1); buzz(30); },
  wrong() { tone(180, .3, 'sawtooth', 0, .08); buzz([60, 40, 60]); },
  summit() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .35, 'triangle', i * .12)); buzz([40, 30, 40, 30, 80]); },
  tick() { tone(1200, .04, 'square', 0, .03); },
  earn() { [784, 988, 1175].forEach((f, i) => tone(f, .18, 'square', i * .07, .06)); buzz([30, 30, 60]); },
};
function paintSound() { const b = $('#sound'); b.textContent = soundOn ? '🔊' : '🔇'; b.setAttribute('aria-pressed', String(soundOn)); }
$('#sound').onclick = () => { soundOn = !soundOn; store.set('piramida-zvuk', soundOn ? '1' : '0'); paintSound(); if (soundOn) tone(880, .08); };
paintSound();

// ---------- navigacija ----------
function nav() {
  $('#nav').innerHTML = me
    ? `<button class="icon-btn" data-v="board" aria-label="Ljestvica" title="Ljestvica">🏆</button><button class="icon-btn" data-v="profile" aria-label="Profil" title="Profil">👤</button>`
    : '';
  $('#nav').onclick = e => { const v = e.target.closest('[data-v]'); if (v) go(v.dataset.v); };
  $('#streak').innerHTML = me && streak > 0 ? `<span class="chip flame" title="Dana zaredom">🔥 ${streak}</span>` : '';
}
$('#home').onclick = () => go(me ? 'play' : 'auth');
function go(v, arg) { view = v; clearInterval(timerId); clearInterval(countId); nav(); ({ play, board, profile, auth })[v](arg); window.scrollTo(0, 0); }

// ---------- piramida ----------
function pyramid(run, { pop = -1, compact = false } = {}) {
  const answers = run ? run.answers : [];
  const cur = run && run.status !== 'finished' ? run.q : -1;
  const rows = []; let i = 0;
  R.levels.forEach(l => {
    const cells = [];
    for (let k = 0; k < l.count; k++, i++) {
      const a = answers[i];
      let cls = 'blk' + (a ? (a.c ? ' done' : ' miss') : '') + (i === cur ? ' now' : '') + (i === pop ? ' pop' : '');
      const doubledNow = i === cur && run.doubled;
      const tag = (a && a.d) || doubledNow ? '<span class="tag">×2</span>' : '';
      cells.push(`<div class="${cls}" title="Pitanje ${i + 1}, ${l.points} bodova">${l.points}${tag}</div>`);
    }
    rows.push(`<div class="row">${cells.join('')}</div>`);
  });
  return `<div class="pyr${compact ? ' compact' : ''}" role="img" aria-label="Piramida: ${answers.filter(a => a.c).length} točnih od ${Game.TOTAL}">${rows.reverse().join('')}</div>`;
}
function hud(run) {
  const hearts = '♥'.repeat(run.lives) + '♡'.repeat(R.lives - run.lives);
  return `<div class="hud">
    <div><small>Bodovi</small><b id="cur">${run.current}</b></div>
    <div class="dbl"><small>Dupli ×2 · ⚡ ${run.fastStreak}/${R.earnDouble.streak}</small><b aria-label="Zarađenih duplih uloga: ${run.doublesLeft}">${run.doublesLeft}</b></div>
    <div class="lives"><small>Životi</small><b aria-label="${run.lives} od ${R.lives}">${hearts}</b></div></div>`;
}
function floatText(t, bad) {
  const el = document.createElement('div'); el.className = 'float' + (bad ? ' bad' : ''); el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1100);
}

// ---------- igra ----------
async function play() {
  const d = await api('me');
  today = d.date; streak = d.streak || 0; nav();
  render(d.run);
}
function render(run, opts = {}) {
  clearInterval(timerId);
  if (!run) return intro();
  if (run.status === 'finished') {
    // niz dana se mijenja tek kad igra završi: osvježi ga prije prikaza kraja
    if (opts.event) return api('me').then(d => { streak = d.streak || 0; nav(); finished(run, opts); }, () => finished(run, opts));
    return finished(run, opts);
  }
  if (run.status === 'question') return question(run, opts);
  ready(run, opts);
}

function intro() {
  $('#app').innerHTML = `<div class="fade-in">
    ${pyramid(null)}
    <p class="eyebrow">Izazov za ${fmtDate(today)}</p>
    <h1>15 pitanja. Jedan uspon dnevno.</h1>
    <ul class="rules">
      <li><span>⏱</span><span>${R.secondsPerQuestion} sekundi po pitanju. Brži odgovor donosi do +${R.speedBonusShare * 100} % bodova.</span></li>
      <li><span>−</span><span>Kriv odgovor ili istek vremena oduzima bodove tog pitanja.</span></li>
      <li><span>♥</span><span>Imaš ${R.lives} života. Druga greška završava uspon, a vrijede bodovi koje tada imaš.</span></li>
      <li><span>⚡</span><span><b>Dupli ili ništa se zarađuje</b>: ${R.earnDouble.streak} točna odgovora zaredom, svaki za manje od ${R.earnDouble.withinMs / 1000} sekunde. Svaka takva trojka donosi novi ulog. Ulog biraš prije nego što vidiš pitanje: točno donosi dvostruko, krivo oduzima dvostruko.</span></li>
      <li><span>🔥</span><span>Igraj svaki dan za bonus niza: +${R.streakBonusPerDay} bodova po danu, najviše +${R.streakBonusMax}.</span></li>
    </ul>
    <button class="btn wide" id="start" style="margin-top:20px">Kreni na uspon</button></div>`;
  $('#start').onclick = async () => { tone(440, .01, 'sine', 0, .001); const r = await api('run/start', {}); wantDouble = false; render(r.run); };
}

function ready(run, { pop = -1, event = null } = {}) {
  const n = run.next;
  $('#app').innerHTML = `<div>
    ${hud(run)}
    ${pyramid(run, { pop })}
    <div class="panel fade-in" id="nextPanel">
      <p class="eyebrow">Pitanje ${run.q + 1} od ${run.total} · razina ${n.level}</p>
      <h2>Vrijedi ${n.points} bodova</h2>
      <button class="double" id="dbl" aria-pressed="${wantDouble && run.doublesLeft > 0}" ${run.doublesLeft ? '' : 'disabled'}>
        <span class="sw" aria-hidden="true"></span>
        <span><strong>Dupli ili ništa${run.doublesLeft ? ` · imaš ${run.doublesLeft}` : ''}</strong><span class="small">${run.doublesLeft
          ? `točno +${n.points * 2}, krivo −${n.points * 2}`
          : `Zaradi ga: ${R.earnDouble.streak} točna zaredom, svaki za manje od ${R.earnDouble.withinMs / 1000} s`}</span></span>
        <span class="pips" aria-label="Brzi niz ${run.fastStreak} od ${R.earnDouble.streak}">${Array.from({ length: R.earnDouble.streak }, (_, k) => `<i class="${k < run.fastStreak ? '' : 'used'}"></i>`).join('')}</span>
      </button>
      <button class="btn wide" id="go" style="margin-top:14px">Prikaži pitanje</button>
    </div></div>`;
  const dbl = $('#dbl');
  dbl.onclick = () => { wantDouble = !wantDouble; dbl.setAttribute('aria-pressed', String(wantDouble)); tone(wantDouble ? 520 : 300, .08, 'square', 0, .05); };
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    try { const r = await api('run/next', { q: run.q, double: wantDouble && run.doublesLeft > 0 }); wantDouble = false; render(r.run); }
    catch (e) { $('#go').disabled = false; alertMsg(e); }
  };
}

function question(run) {
  const q = run.question;
  const keys = ['A', 'B', 'C', 'D'];
  $('#app').innerHTML = `<div>
    ${hud(run)}
    ${pyramid(run, { compact: true })}
    <div class="panel fade-in">
      <div class="meta"><span>Pitanje ${run.q + 1} · ${run.next.points}${run.doubled ? ' ×2' : ''} bodova</span><span id="secs">${q.secondsLeft} s</span></div>
      <div class="timer" id="tm"><i id="bar" style="width:${q.secondsLeft / R.secondsPerQuestion * 100}%"></i></div>
      <p class="q">${esc(q.text)}</p>
      <div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div></div>`;
  let left = q.secondsLeft, done = false;
  const submit = async choice => {
    if (done) return; done = true; clearInterval(timerId);
    document.querySelectorAll('.opt').forEach(b => b.disabled = true);
    try {
      const r = await api('run/answer', { q: run.q, choice });
      const res = r.result, btns = document.querySelectorAll('.opt');
      btns[res.correctChoice].classList.add('right');
      if (!res.correct && choice !== null) btns[choice].classList.add('wrong');
      const fb = $('#fb');
      if (res.correct) {
        const fast = res.ms <= R.earnDouble.withinMs;
        fb.className = 'fb ok';
        fb.textContent = `Točno${fast ? ' ⚡' : ''}! +${res.gained}${res.speedBonus ? ` i +${res.speedBonus} za brzinu` : ''}` + (res.earned ? ' · Zaradio si dupli ulog!' : '');
        floatText(res.earned ? '⚡ ×2' : '+' + (res.gained + res.speedBonus)); res.event === 'summit' ? sfx.summit() : res.earned ? sfx.earn() : sfx.right();
      } else {
        fb.className = 'fb bad';
        fb.textContent = (res.timedOut ? 'Vrijeme je isteklo.' : 'Netočno.') + (res.gained < 0 ? ` ${res.gained} bodova` : '');
        if (res.gained < 0) floatText(String(res.gained), true);
        sfx.wrong();
      }
      setTimeout(() => render(r.run, { pop: run.q, event: res.event }), res.correct ? 1100 : 1700);
    } catch (e) { $('#fb').textContent = e.message; setTimeout(play, 1500); }
  };
  document.querySelector('.opts').onclick = e => { const b = e.target.closest('.opt'); if (b) submit(Number(b.dataset.i)); };
  const tick = () => {
    left--; const bar = $('#bar'); if (!bar) return clearInterval(timerId);
    bar.style.width = Math.max(0, left / R.secondsPerQuestion * 100) + '%';
    $('#secs').textContent = Math.max(0, left) + ' s';
    if (left <= 5) { $('#tm').classList.add('low'); if (left > 0) sfx.tick(); }
    if (left <= 0) submit(null);
  };
  timerId = setInterval(tick, 1000);
  if (left <= 0) submit(null);
}

function finished(run, { pop = -1, event = null } = {}) {
  const summit = run.answers.length === run.total && run.answers[run.total - 1].c;
  const title = summit ? 'Na vrhu si!' : run.out ? `Pao si na ${run.answers.length}. pitanju.` : 'Uspon je gotov.';
  const text = Game.shareText(run, fmtDate(today), streak);
  $('#app').innerHTML = `<div class="fade-in">
    ${pyramid(run, { pop })}
    <p class="eyebrow">${fmtDate(today)}</p>
    <h1>${title}</h1>
    <div class="score-big" id="final">${run.score}</div>
    <p class="small" style="margin:0">bodova · ${run.correctCount} od ${run.total} točno${run.streakBonus ? ` · +${run.streakBonus} za niz` : ''}</p>
    <div class="panel">
      <p class="eyebrow">Pohvali se</p>
      <div class="share" id="shareText">${esc(text)}</div>
      <div class="legend"><span>🟩 točno</span><span>🟨 točno uz ×2</span><span>🟥 netočno</span><span>💥 netočno uz ×2</span></div>
      <button class="btn wide" id="copy" style="margin-top:12px">Kopiraj rezultat</button>
      <p class="small" id="copied" aria-live="polite" style="margin:8px 0 0"></p>
    </div>
    <div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div><p class="eyebrow">Nova piramida za</p><div class="count" id="count">--:--:--</div></div>
      ${streak > 0 ? `<div style="text-align:right"><p class="eyebrow">Niz</p><div class="count" style="color:var(--gold)">🔥 ${streak} ${streak === 1 ? 'dan' : 'dana'}</div></div>` : ''}
    </div>
    <div class="row-btns"><button class="btn ghost" id="toBoard">Ljestvica</button>${typeof newAttempt === 'function' ? '<button class="btn ghost" id="again">Nova proba</button>' : ''}</div>
    ${typeof newAttempt === 'function' ? '<p class="small">„Nova proba” postoji samo u probnoj verziji. U pravoj igri igra se jednom dnevno.</p>' : ''}
  </div>`;
  if (summit && event === 'summit') sfx.summit();
  if (event) countUp($('#final'), run.score);
  $('#copy').onclick = () => {
    const ok = () => { $('#copied').textContent = 'Kopirano. Zalijepi prijateljima.'; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#shareText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('#copied').textContent = 'Tekst je označen, kopiraj ga ručno.'; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch { fallback(); }
  };
  $('#toBoard').onclick = () => go('board');
  if ($('#again')) $('#again').onclick = () => newAttempt();
  const paint = () => { const s = secondsToMidnight(); const el = $('#count'); if (!el) return clearInterval(countId);
    el.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':'); };
  paint(); clearInterval(countId); countId = setInterval(paint, 1000);
}
function countUp(el, to) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
// sekunde do ponoći po hrvatskom vremenu (u noći promjene sata može odstupati sat vremena)
function secondsToMidnight() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Zagreb', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return 86400 - (Number(p.hour) * 3600 + Number(p.minute) * 60 + Number(p.second));
}
function fmtDate(d) { const [y, m, dd] = d.split('-'); return `${Number(dd)}. ${Number(m)}. ${y}.`; }
function alertMsg(e) { const fb = $('#fb') || $('#app'); const p = document.createElement('p'); p.className = 'err'; p.textContent = e.message; fb.appendChild(p); }

// ---------- ljestvica ----------
async function board(period = 'daily') {
  const d = await api('leaderboard?period=' + period);
  const t = { daily: 'Danas', weekly: 'Tjedan', alltime: 'Ukupno' };
  $('#app').innerHTML = `<div class="fade-in">
    <h1 style="margin:12px 0 10px">Ljestvica</h1>
    <div class="tabs">${Object.entries(t).map(([k, l]) => `<button class="${k === period ? 'on' : ''}" data-p="${k}">${l}</button>`).join('')}</div>
    ${d.rows.length ? `<div class="list">${d.rows.map((r, i) => `<div class="li"><span class="pos">${i + 1}</span>
        <button class="who" data-u="${esc(r.username)}">${esc(r.username)}<span class="sub">najviša razina ${r.max_level}${period !== 'daily' ? ` · ${r.games} ${r.games === 1 ? 'igra' : 'igara'}` : ''}</span></button>
        <span class="pts">${r.score}</span></div>`).join('')}</div>`
      : '<p class="small">Još nitko nije završio uspon u ovom razdoblju. Budi prvi.</p>'}
    <p class="small">Kod jednakih bodova bolji je brži.</p></div>`;
  $('.tabs').onclick = e => e.target.dataset.p && board(e.target.dataset.p);
  const l = $('.list'); if (l) l.onclick = e => { const b = e.target.closest('[data-u]'); if (b) go('profile', b.dataset.u); };
}

// ---------- profil ----------
async function profile(name) {
  const p = await api('profile/' + encodeURIComponent(name || me));
  $('#app').innerHTML = `<div class="fade-in">
    <p class="eyebrow" style="margin-top:12px">Igrač od ${fmtDate(p.since)}</p>
    <h1>${esc(p.username)}</h1>
    <div class="stats">
      <div><small>Niz dana</small><b>🔥 ${p.streak}</b><small>rekord ${p.bestStreak}</small></div>
      <div><small>Puta na vrhu</small><b>▲ ${p.summits}</b></div>
      <div><small>Najbolji rezultat</small><b>${p.best_score}</b></div>
      <div><small>Odigrano</small><b>${p.games}</b></div>
    </div>
    ${p.recent.length ? `<h2 style="margin:20px 0 10px">Zadnji usponi</h2><div class="list">${p.recent.map(r => `<div class="li"><span class="pos">${r.max_level}</span>
      <span class="who">${fmtDate(r.date)}<span class="sub">${r.correct_count} točno · razina ${r.max_level}</span></span><span class="pts">${r.score}</span></div>`).join('')}</div>` : ''}
    ${!name || name === me ? '<button class="btn ghost wide" id="out" style="margin-top:18px">Odjava</button>' : ''}
  </div>`;
  if ($('#out')) $('#out').onclick = async () => { await api('logout', {}); me = null; streak = 0; go('auth'); };
}

// ---------- prijava ----------
function auth(mode = 'register') {
  const reg = mode === 'register';
  $('#app').innerHTML = `<div class="fade-in">
    ${pyramid({ answers: [{ c: 1 }, { c: 1 }, { c: 1 }, { c: 1 }, { c: 1 }, { c: 1 }, { c: 1 }, { c: 0 }, { c: 1 }, { c: 1 }], status: 'question', q: 10, doubled: false })}
    <h1>Penji se svaki dan.</h1>
    <p style="color:var(--stone-dim);margin:8px 0 0">Ista piramida od 15 pitanja za sve igrače. Jedan pokušaj dnevno, jedna ljestvica.</p>
    <form id="f" class="panel" novalidate>
      <label for="u">Korisničko ime</label><input id="u" name="username" autocomplete="username" required>
      <label for="pw">Lozinka</label><input id="pw" name="password" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required minlength="8">
      <div class="err" id="err"></div>
      <button class="btn wide">${reg ? 'Napravi račun i igraj' : 'Prijavi se'}</button>
      <button type="button" class="linkish" id="sw">${reg ? 'Već imam račun' : 'Nemam račun'}</button>
    </form></div>`;
  $('#sw').onclick = () => auth(reg ? 'login' : 'register');
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { const r = await api(reg ? 'register' : 'login', { username: f.get('username'), password: f.get('password') }); me = r.username; go('play'); }
    catch (err) { $('#err').textContent = err.message; }
  };
}

(async () => {
  try { const d = await api('me'); me = d.username; go('play'); } catch { go('auth'); }
})();
</script>
