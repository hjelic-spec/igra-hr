<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dnevna piramida</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2dfd7; --accent:#2f5d50; --accent-ink:#fff;
          --ok:#2e7d4f; --bad:#b3261e; --lv1:#cfe3d8; --lv2:#b5d3c3; --lv3:#94bfa9; --lv4:#6fa58c; --lv5:#d4a537; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141517; --card:#1e1f22; --ink:#ececee; --muted:#9a9aa1; --line:#2e3034;
          --accent:#6fb59a; --accent-ink:#0d1f18; --ok:#5cc28a; --bad:#ef6b62; --lv1:#20352c; --lv2:#27463a; --lv3:#2f5949; --lv4:#3a6f5b; --lv5:#8a6a1c; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; max-width:760px; margin:0 auto; }
  header h1 { font-size:20px; white-space:nowrap; margin:0; letter-spacing:.2px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button, .tabs button { background:none; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:6px 12px; cursor:pointer; font:inherit; font-size:14px; }
  nav button.on, .tabs button.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  main { max-width:760px; margin:0 auto; padding:0 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:12px; }
  .muted { color:var(--muted); font-size:14px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; margin:6px 0 12px; }
  .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:11px 18px; font:inherit; font-weight:600; cursor:pointer; }
  .btn.ghost { background:none; color:var(--accent); border:1px solid var(--accent); }
  .err { color:var(--bad); min-height:1.4em; font-size:14px; }
  .pyramid { display:flex; flex-direction:column-reverse; align-items:center; gap:4px; margin:8px 0 4px; }
  .row { display:flex; gap:4px; justify-content:center; }
  .cell { width:44px; height:26px; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center; font-size:12px; color:var(--muted); }
  .cell.done { color:var(--ink); font-weight:600; } .cell.miss { background:transparent !important; border-color:var(--bad); color:var(--bad); }
  .cell.now { outline:2px solid var(--ink); outline-offset:1px; }
  .stats { display:flex; gap:16px; flex-wrap:wrap; justify-content:space-between; margin-bottom:10px; }
  .stats b { font-size:20px; display:block; }
  .q { font-size:20px; font-weight:600; margin:10px 0 14px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px) { .opts { grid-template-columns:1fr; } .cell { width:36px; } header h1 { font-size:17px; } nav button { padding:5px 9px; font-size:13px; } }
  .opt { text-align:left; padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--accent); }
  .opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 18%, transparent); }
  .opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 18%, transparent); }
  .timer { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; }
  .timer i { display:block; height:100%; background:var(--accent); transition:width 1s linear; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td, th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--muted); font-weight:500; font-size:13px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--accent); cursor:pointer; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .feedback { margin-top:12px; font-weight:600; min-height:1.4em; }
</style>
</head>
<body>
<header>
  <h1>▲ Dnevna piramida</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Greška'), { status:r.status });
  return d;
}
let me = null, rules = null, view = 'play', timerId = null, history = [];
const setHistory = run => { history = (run.answers || []).map(c => ({ correct:c })); };

function nav() {
  const items = me ? [['play','Igraj'],['board','Ljestvica'],['profile','Profil']] : [['board','Ljestvica']];
  $('#nav').innerHTML = items.map(([k,l]) => `<button class="${view===k?'on':''}" data-v="${k}">${l}</button>`).join('')
    + (me ? `<button data-v="logout">Odjava</button>` : `<button class="${view==='login'?'on':''}" data-v="login">Prijava</button>`);
  $('#nav').onclick = e => { const v = e.target.dataset.v; if (v === 'logout') logout(); else if (v) go(v); };
}
function go(v, arg) { view = v; clearInterval(timerId); nav(); ({ play, board, profile, login })[v](arg); }

function pyramid(qIndex, finished) {
  let i = 0; const rows = [];
  for (const l of rules.levels) {
    const cells = [];
    for (let k = 0; k < l.count; k++, i++) {
      const h = history[i]; let cls = 'cell', label = l.points;
      if (h) cls += h.correct ? ' done' : ' miss';
      if (h && h.correct) cls += '';
      const style = h && h.correct ? `background:var(--lv${l.level})` : '';
      if (!finished && i === qIndex) cls += ' now';
      cells.push(`<div class="${cls}" style="${style}" title="Razina ${l.level}">${h ? (h.correct ? '✓' : '✗') : label}</div>`);
    }
    rows.push(`<div class="row">${cells.join('')}</div>`);
  }
  return `<div class="pyramid">${rows.join('')}</div>`;
}

async function play() {
  const app = $('#app');
  const d = await api('me');
  const run = d.run;
  if (!run) {
    history = [];
    app.innerHTML = `<div class="card">
      <h2 style="margin-top:0">Izazov za ${new Date(d.date).toLocaleDateString('hr-HR')}</h2>
      ${pyramid(-1, true)}
      <p>Danas svi igrači dobivaju istu piramidu od ${rules.levels.reduce((a,l)=>a+l.count,0)} pitanja. Kreneš od dna (lakša pitanja) i penješ se prema vrhu.</p>
      <ul class="muted">
        <li>Igraš samo jednom dnevno.</li>
        <li>${rules.secondsPerQuestion} sekundi po pitanju. Brži odgovor donosi do +${rules.speedBonusShare*100} % bodova.</li>
        <li>Imaš ${rules.lives} života: ${rules.lives - 1 === 1 ? 'jedna greška je dopuštena' : (rules.lives-1)+' greške su dopuštene'}, sljedeća završava uspon.</li>
        <li>Igraj svaki dan za bonus niza: +${rules.streakBonusPerDay} bodova po danu, najviše +${rules.streakBonusMax}.</li>
      </ul>
      <button class="btn" id="start">Kreni na vrh</button></div>`;
    $('#start').onclick = async () => { const r = await api('run/start', {}); renderRun(r.run); };
    return;
  }
  renderRun(run);
}

function renderRun(run) {
  clearInterval(timerId);
  setHistory(run);
  if (run.status !== 'playing') return renderDone(run);
  const q = run.question;
  $('#app').innerHTML = `<div class="card">
    <div class="stats">
      <div><span class="muted">Razina</span><b>${q.level} / ${rules.levels.length}</b></div>
      <div><span class="muted">Pitanje</span><b>${q.index + 1} / ${q.total}</b></div>
      <div><span class="muted">Bodovi</span><b>${run.score}</b></div>
      <div><span class="muted">Životi</span><b>${'♥'.repeat(run.lives)}${'♡'.repeat(rules.lives - run.lives)}</b></div>
    </div>
    ${pyramid(q.index, false)}
    <div class="q">${esc(q.text)}</div>
    <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div class="timer"><i id="bar" style="width:${q.secondsLeft / rules.secondsPerQuestion * 100}%"></i></div>
    <div class="muted" id="secs">${q.secondsLeft} s · vrijedi ${q.points} bodova</div>
    <div class="feedback" id="fb"></div></div>`;
  let left = q.secondsLeft, answered = false;
  const submit = async choice => {
    if (answered) return; answered = true; clearInterval(timerId);
    document.querySelectorAll('.opt').forEach(b => b.disabled = true);
    try {
      const r = await api('run/answer', { index:q.index, choice });
      history[q.index] = { correct:r.result.correct };
      const btns = document.querySelectorAll('.opt');
      btns[r.result.correctChoice].classList.add('right');
      if (!r.result.correct && choice !== null) btns[choice].classList.add('wrong');
      $('#fb').innerHTML = r.result.correct
        ? `<span style="color:var(--ok)">Točno! +${r.result.gained} +${r.result.speedBonus} za brzinu</span>`
        : `<span style="color:var(--bad)">${r.result.timedOut ? 'Isteklo je vrijeme.' : 'Netočno.'}</span>`;
      setTimeout(() => renderRun(r.run), 1300);
    } catch (e) { $('#fb').textContent = e.message; setTimeout(play, 1500); }
  };
  document.querySelector('.opts').onclick = e => { const i = e.target.dataset.i; if (i !== undefined) submit(Number(i)); };
  timerId = setInterval(() => {
    left--; $('#bar').style.width = Math.max(0, left / rules.secondsPerQuestion * 100) + '%';
    $('#secs').textContent = `${Math.max(0,left)} s · vrijedi ${q.points} bodova`;
    if (left <= 0) submit(null);
  }, 1000);
  if (left <= 0) submit(null);
}

function renderDone(run) {
  const summit = run.maxLevel === rules.levels.length;
  $('#app').innerHTML = `<div class="card">
    <h2 style="margin-top:0">${summit ? 'Stigao si na vrh! ▲' : 'Današnji uspon je gotov'}</h2>
    ${history.length ? pyramid(-1, true) : ''}
    <div class="stats">
      <div><span class="muted">Ukupno</span><b>${run.score}</b></div>
      <div><span class="muted">Točni odgovori</span><b>${run.correctCount}</b></div>
      <div><span class="muted">Najviša razina</span><b>${run.maxLevel}</b></div>
    </div>
    <p class="muted">Osnovni bodovi ${run.baseScore} · brzina +${run.speedBonus} · niz +${run.streakBonus}</p>
    <p>Nova piramida stiže sutra u ponoć (hrvatsko vrijeme).</p>
    <button class="btn" onclick="go('board')">Pogledaj ljestvicu</button></div>`;
}

async function board(period = 'daily') {
  const d = await api('leaderboard?period=' + period);
  const t = { daily:'Danas', weekly:'Ovaj tjedan', alltime:'Ukupno' };
  $('#app').innerHTML = `<div class="card">
    <div class="tabs">${Object.entries(t).map(([k,l])=>`<button class="${k===period?'on':''}" data-p="${k}">${l}</button>`).join('')}</div>
    ${d.rows.length ? `<table><tr><th>#</th><th>Igrač</th><th class="n">Bodovi</th><th class="n">Najviša razina</th>${period!=='daily'?'<th class="n">Igara</th>':''}</tr>
      ${d.rows.map((r,i)=>`<tr><td>${i+1}</td><td><a data-u="${esc(r.username)}">${esc(r.username)}</a></td><td class="n">${r.score}</td><td class="n">${r.max_level}</td>${period!=='daily'?`<td class="n">${r.games}</td>`:''}</tr>`).join('')}</table>`
      : '<p class="muted">Još nitko nije završio izazov u ovom razdoblju.</p>'}
    <p class="muted">Kod jednakih bodova bolji je igrač s kraćim ukupnim vremenom odgovaranja.</p></div>`;
  $('.tabs').onclick = e => e.target.dataset.p && board(e.target.dataset.p);
  $('table') && ($('table').onclick = e => e.target.dataset.u && go('profile', e.target.dataset.u));
}

async function profile(name) {
  name = name || me;
  const p = await api('profile/' + encodeURIComponent(name));
  $('#app').innerHTML = `<div class="card">
    <h2 style="margin-top:0">${esc(p.username)}</h2>
    <p class="muted">Igra od ${new Date(p.since).toLocaleDateString('hr-HR')}</p>
    <div class="stats">
      <div><span class="muted">Najviša razina</span><b>${p.max_level} / ${rules.levels.length}</b></div>
      <div><span class="muted">Puta na vrhu</span><b>${p.summits}</b></div>
      <div><span class="muted">Najbolji rezultat</span><b>${p.best_score}</b></div>
      <div><span class="muted">Niz dana</span><b>${p.streak} <span class="muted">(rekord ${p.bestStreak})</span></b></div>
      <div><span class="muted">Odigrano</span><b>${p.games}</b></div>
    </div>
    ${p.recent.length ? `<table><tr><th>Datum</th><th class="n">Bodovi</th><th class="n">Razina</th><th class="n">Točno</th></tr>
      ${p.recent.map(r=>`<tr><td>${new Date(r.date).toLocaleDateString('hr-HR')}</td><td class="n">${r.score}</td><td class="n">${r.max_level}</td><td class="n">${r.correct_count}</td></tr>`).join('')}</table>` : ''}
  </div>`;
}

function login(mode = 'login') {
  $('#app').innerHTML = `<div class="card" style="max-width:420px;margin:12px auto">
    <h2 style="margin-top:0">${mode==='login'?'Prijava':'Registracija'}</h2>
    <form id="f"><label>Korisničko ime<input name="username" autocomplete="username" required></label>
    <label>Lozinka<input name="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" required minlength="8"></label>
    <div class="err" id="err"></div>
    <button class="btn">${mode==='login'?'Prijavi se':'Napravi račun'}</button>
    <button type="button" class="btn ghost" id="sw">${mode==='login'?'Nemam račun':'Već imam račun'}</button></form></div>`;
  $('#sw').onclick = () => login(mode === 'login' ? 'register' : 'login');
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { const r = await api(mode, { username:f.get('username'), password:f.get('password') }); me = r.username; go('play'); }
    catch (err) { $('#err').textContent = err.message; }
  };
}
async function logout() { await api('logout', {}); me = null; go('login'); }

(async () => {
  rules = await api('rules');
  try { me = (await api('me')).username; go('play'); } catch { go('login'); }
})();
</script>
</body>
</html>
